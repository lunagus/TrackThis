<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="badgeGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#151E2B" />
      <stop offset="80%" stop-color="#070A0E" />
      <stop offset="100%" stop-color="#020406" />
    </radialGradient>
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#00E5FF" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Circular Outer Badge -->
  <circle cx="256" cy="256" r="246" fill="url(#badgeGrad)" stroke="#1F2B3B" stroke-width="8" />
  
  <!-- Subtle Inner Accent Ring -->
  <circle cx="256" cy="256" r="236" fill="none" stroke="#00E5FF" stroke-width="2" stroke-opacity="0.25" stroke-dasharray="6 4" />

  <!-- Classic Curvy Manga Heart Shape -->
  <path d="M 256,425 C 130,315 68,238 68,160 C 68,98 114,52 176,52 C 218,52 244,82 256,110 C 268,82 294,52 336,52 C 398,52 444,98 444,160 C 444,238 382,315 256,425 Z"
        fill="#00E5FF"
        stroke="#FFFFFF"
        stroke-width="12"
        stroke-linejoin="round"
        filter="url(#cyanGlow)" />

  <!-- Crisp Centered White Plus Symbol -->
  <g fill="#FFFFFF">
    <!-- Vertical bar -->
    <rect x="238" y="165" width="36" height="96" rx="8" />
    <!-- Horizontal bar -->
    <rect x="208" y="195" width="96" height="36" rx="8" />
  </g>
</svg>
