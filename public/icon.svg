<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="badgeGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#161f2b" />
      <stop offset="85%" stop-color="#0B0F14" />
      <stop offset="100%" stop-color="#05070a" />
    </radialGradient>
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#00E5FF" flood-opacity="0.45" />
    </filter>
    <pattern id="screentone" width="8" height="8" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="1" fill="#00E5FF" fill-opacity="0.12" />
    </pattern>
  </defs>

  <!-- Circular Outer Badge -->
  <circle cx="256" cy="256" r="244" fill="url(#badgeGrad)" stroke="#263238" stroke-width="8" />
  
  <!-- Screentone Inner Ring -->
  <circle cx="256" cy="256" r="236" fill="url(#screentone)" />
  <circle cx="256" cy="256" r="236" fill="none" stroke="#00E5FF" stroke-width="2" stroke-opacity="0.3" stroke-dasharray="6 4" />

  <!-- Manga Heart Shape -->
  <path d="M 256,410 C 256,410 100,312 100,204 C 100,136 154,86 220,86 C 242,86 256,98 256,98 C 256,98 270,86 292,86 C 358,86 412,136 412,204 C 412,312 256,410 256,410 Z"
        fill="#00E5FF"
        stroke="#FFFFFF"
        stroke-width="10"
        stroke-linejoin="round"
        filter="url(#cyanGlow)" />

  <!-- Centered Bold Crisp White Plus Symbol -->
  <g fill="#FFFFFF">
    <!-- Vertical bar -->
    <rect x="238" y="160" width="36" height="110" rx="8" />
    <!-- Horizontal bar -->
    <rect x="201" y="197" width="110" height="36" rx="8" />
  </g>
</svg>
